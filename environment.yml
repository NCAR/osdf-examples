# Conda environment for running the osdf-examples notebooks locally.
#
# Lists DIRECT dependencies only, with no build strings and no
# OS-specific packages, so it solves on Linux, macOS (incl. osx-arm64),
# and Windows. Versions resolve to a compatible set at install time.
#
# (Do NOT replace this with a `conda env export` dump — that pins
#  Linux-only packages like `_libgcc_mutex`/`libgcc-ng` with full build
#  strings, which fails to solve on macOS/Windows.)
#
# Usage:
#   conda env create -n osdf -f environment.yml
#   conda activate osdf
#
# Tip: set strict channel priority for faster, cleaner solves:
#   conda config --set channel_priority strict

name: osdf
channels:
  - conda-forge
dependencies:
  - python>=3.10

  # Core scientific Python
  - numpy
  - pandas
  - scipy
  - xarray
  - matplotlib-base
  - seaborn

  # Geoscience / climate
  - cartopy
  - cf-units
  - cftime
  - nc-time-axis
  - geocat-comp
  - uxarray
  - xarray-regrid
  - xhistogram
  - geopandas
  - shapely
  - pyproj
  - rioxarray

  # OSDF data access + catalogs
  - pelicanfs
  - intake
  - intake-esm
  - kerchunk
  - zarr
  - fsspec
  - aiohttp
  - requests
  - netcdf4
  - h5netcdf
  - s3fs
  # Parquet engines for kerchunk lazy references. pyarrow is the
  # preferred engine — fastparquet mis-decodes null `raw` cells in
  # lazy-parquet references as NaN (see the mesaclip notebook). Keep both
  # installed; select pyarrow explicitly when opening such references.
  - pyarrow
  - fastparquet

  # Parallel compute
  - dask
  - distributed
  - dask-jobqueue   # NCAR PBSCluster on Casper / Derecho
  - dask-gateway    # cloud / JupyterHub gateway setups

  # ML
  - scikit-learn

  # Interactive maps / plotting extras
  - folium
  - branca

  # Misc
  - tqdm
  - psutil
  - nest-asyncio

  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets

  - pip
  - pip:
      # cmap (colormap library) — installed via pip to avoid a
      # conda-forge name collision.
      - cmap
      # heat-index calculation used by jja_heatindex.ipynb
      - heatindex
